# إعداد Render (Blueprint) — الخطة المجانية للتجربة.
# الخطة المجانية لا تحفظ الملفات، لذلك قاعدة البيانات على Turso (مجانية ودائمة).
# في Render: New → Blueprint → اختر هذا المستودع. سيطلب منك القيم المعلّمة sync: false.
#
# الترقية لاحقًا للخطة المدفوعة: غيّر plan إلى starter فقط (البيانات تبقى على Turso كما هي).
services:
  - type: web
    name: attendance
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: ADMIN_NAME
        value: علي عودة
      - key: COMPANY_1_NAME
        value: شركة التيسير
      - key: COMPANY_2_NAME
        value: اتحاد مقاولين المياه
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_AUTH_TOKEN
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
