<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16325c"/>
      <stop offset="0.55" stop-color="#1c4f87"/>
      <stop offset="1" stop-color="#1f8fa6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c4f87"/>
      <stop offset="1" stop-color="#16325c"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0b1a33" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- الخلفية (rect يُقصّ لاحقًا حسب نوع الأيقونة) -->
  <rect id="base" width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <!-- ظل برتقالي تحت الدبوس -->
  <ellipse cx="256" cy="414" rx="78" ry="17" fill="#f07a22"/>
  <!-- دبوس الموقع -->
  <path filter="url(#shadow)" fill="#ffffff"
        d="M256 402 C 238 380 142 290 142 212 A 114 114 0 1 1 370 212 C 370 290 274 380 256 402 Z"/>
  <!-- دائرة داخلية وعلامة صح -->
  <circle cx="256" cy="212" r="70" fill="url(#dot)"/>
  <path d="M220 214 L247 241 L294 190" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
